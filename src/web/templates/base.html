<!DOCTYPE html>
<html lang="{{ current_lang or 'en' }}" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SME Finance Copilot — Autonomous Financial AI{% endblock %}</title>
    
    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/images/favicon.png">
    <link rel="shortcut icon" href="/static/images/favicon.ico">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            950: '#030712',
                            900: '#080e1e',
                            850: '#0b132b',
                            800: '#0f172a',
                            700: '#1e293b',
                            600: '#334155',
                        },
                        cyan: {
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                        },
                        emerald: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                        },
                        indigo: {
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'Noto Sans Bengali', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                        display: ['Orbitron', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js CDN for Financial & Forecast Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Google Fonts: Inter, JetBrains Mono, Orbitron, Noto Sans Bengali, Noto Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- Unified Design System Tokens & Motion -->
    <link rel="stylesheet" href="/static/css/theme.css">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans SC', 'Noto Sans Bengali', sans-serif;
            background-color: #030712;
            color: #f1f5f9;
            min-height: 100vh;
        }

        .font-orbitron {
            font-family: 'Orbitron', 'Inter', sans-serif;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(11, 19, 43, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel-glow {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 211, 238, 0.3);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.12);
        }

        .glass-panel-emerald {
            background: rgba(11, 25, 30, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.12);
        }

        .glass-input {
            background: rgba(11, 19, 43, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.25);
            background: rgba(15, 23, 42, 0.95);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(3, 7, 18, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.6);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.8);
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col min-h-screen antialiased bg-[#030712] text-slate-100 selection:bg-cyan-500/30 selection:text-cyan-200">
    
    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none"></div>

    <!-- Main View Content Block -->
    {% block content %}{% endblock %}

    <!-- Client-side Controller -->
    <script src="/static/js/app.js"></script>

    <!-- Auto-initialize Lucide Icons -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
