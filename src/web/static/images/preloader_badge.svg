<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes badgeSpinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes badgeSpinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes badgePulse {
      0%, 100% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .badge-ring-1 {
      transform-origin: 60px 60px;
      animation: badgeSpinClockwise 3s linear infinite;
    }
    .badge-ring-2 {
      transform-origin: 60px 60px;
      animation: badgeSpinCounter 4.5s linear infinite;
    }
    .badge-core {
      transform-origin: 60px 60px;
      animation: badgePulse 2s ease-in-out infinite;
    }
  </style>

  <!-- Outer Spinning Arc -->
  <g class="badge-ring-1">
    <circle cx="60" cy="60" r="48" fill="none" stroke="url(#badgeGrad1)" stroke-width="4" stroke-linecap="round" stroke-dasharray="160 80" filter="url(#badgeGlow)"/>
    <circle cx="108" cy="60" r="4" fill="#00F2FE"/>
  </g>

  <!-- Inner Counter Arc -->
  <g class="badge-ring-2">
    <circle cx="60" cy="60" r="36" fill="none" stroke="url(#badgeGrad2)" stroke-width="3" stroke-linecap="round" stroke-dasharray="100 60"/>
    <circle cx="24" cy="60" r="3" fill="#10B981"/>
  </g>

  <!-- Center Glowing Core with Mini Financial Bars -->
  <g class="badge-core">
    <circle cx="60" cy="60" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="50" y="58" width="4" height="12" rx="2" fill="#38BDF8"/>
    <rect x="58" y="52" width="4" height="18" rx="2" fill="#10B981"/>
    <rect x="66" y="55" width="4" height="15" rx="2" fill="#34D399"/>
  </g>
</svg>
