<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 95" fill="none">
  <defs>
    <linearGradient id="ffGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <linearGradient id="ffCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="ffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Top 'F' Sweeping Wing -->
  <path class="ff-shape-f" 
        d="M38 18 C52 18 64 22 72 26 C64 32 50 34 38 34 C30 34 24 38 22 45 L21 54 C18 42 22 24 38 18 Z" 
        fill="url(#ffGreenGrad)"/>

  <!-- Bottom 'P' Cradle with Upward Curving Stem -->
  <path class="ff-shape-p" 
        d="M21 54 C26 44 34 38 48 38 C62 38 72 44 76 52 C78 57 78 68 70 76 C62 84 48 84 36 84 C30 84 26 78 26 70 L28 58 C24 64 22 74 24 82 C28 92 38 92 50 92 C68 92 84 82 86 64 C88 48 78 34 58 32 C42 30 30 38 21 54 Z" 
        fill="url(#ffCyanGrad)"/>

  <!-- Continuous Flowing Upward Growth Arrow -->
  <g class="ff-arrow-group">
    <path class="ff-arrow-trail" 
          d="M26 62 C34 54 48 44 68 32 L78 26" 
          stroke="url(#ffGreenGrad)" stroke-width="3.2" stroke-linecap="round"/>
    <path class="ff-arrowhead" 
          d="M72 23 L85 24 L80 37 Z" 
          fill="#00E599" filter="url(#ffGlow)"/>
  </g>

  <!-- 3 Financial Growth Chart Bars -->
  <g class="ff-bars">
    <rect class="ff-bar ff-bar-1" x="46" y="60" width="4.5" height="15" rx="2" fill="#00E599"/>
    <rect class="ff-bar ff-bar-2" x="54" y="52" width="4.5" height="23" rx="2" fill="#10B981"/>
    <rect class="ff-bar ff-bar-3" x="62" y="44" width="4.5" height="31" rx="2" fill="#22D3EE" filter="url(#ffGlow)"/>
  </g>
</svg>
