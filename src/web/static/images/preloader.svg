<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>

    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Inline CSS Animations (100% GitHub Markdown Compatible) -->
  <style>
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(0.96); opacity: 0.85; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 16px rgba(52, 211, 153, 0.8)); }
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes dotWave {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }
    @keyframes barDance1 {
      0%, 100% { height: 14px; y: 118px; }
      50% { height: 26px; y: 106px; }
    }
    @keyframes barDance2 {
      0%, 100% { height: 28px; y: 104px; }
      50% { height: 16px; y: 116px; }
    }
    @keyframes barDance3 {
      0%, 100% { height: 20px; y: 112px; }
      50% { height: 32px; y: 100px; }
    }
    @keyframes orbitPulse {
      0%, 100% { r: 3.5px; opacity: 0.7; }
      50% { r: 5px; opacity: 1; }
    }

    .spin-ring-1 {
      transform-origin: 250px 120px;
      animation: spinClockwise 4s linear infinite;
    }
    .spin-ring-2 {
      transform-origin: 250px 120px;
      animation: spinCounterClockwise 6s linear infinite;
    }
    .core-pulse {
      transform-origin: 250px 120px;
      animation: pulseCore 2.5s ease-in-out infinite;
    }
    .text-pulse {
      animation: pulseText 2s ease-in-out infinite;
    }
    .bar-1 { animation: barDance1 1.2s ease-in-out infinite; }
    .bar-2 { animation: barDance2 1.5s ease-in-out infinite 0.2s; }
    .bar-3 { animation: barDance3 1.3s ease-in-out infinite 0.4s; }
    .dot-1 { animation: dotWave 1.4s ease-in-out infinite 0.0s; }
    .dot-2 { animation: dotWave 1.4s ease-in-out infinite 0.2s; }
    .dot-3 { animation: dotWave 1.4s ease-in-out infinite 0.4s; }
  </style>

  <!-- Card Background -->
  <rect x="5" y="5" width="490" height="310" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Ambient Decorative Tech Grid Dots -->
  <g opacity="0.15" fill="#38BDF8">
    <circle cx="40" cy="40" r="1.5"/>
    <circle cx="70" cy="40" r="1.5"/>
    <circle cx="40" cy="70" r="1.5"/>
    <circle cx="430" cy="40" r="1.5"/>
    <circle cx="460" cy="40" r="1.5"/>
    <circle cx="460" cy="70" r="1.5"/>
    <circle cx="40" cy="250" r="1.5"/>
    <circle cx="40" cy="280" r="1.5"/>
    <circle cx="70" cy="280" r="1.5"/>
    <circle cx="430" cy="280" r="1.5"/>
    <circle cx="460" cy="280" r="1.5"/>
    <circle cx="460" cy="250" r="1.5"/>
  </g>

  <!-- Animated Outer Orbiting Dash Ring (Clockwise) -->
  <g class="spin-ring-1">
    <circle cx="250" cy="120" r="62" fill="none" stroke="url(#ringGrad1)" stroke-width="3" stroke-linecap="round" stroke-dasharray="80 35 40 30" filter="url(#softGlow)"/>
    <!-- Orbiting Satellite Node -->
    <circle cx="312" cy="120" r="4" fill="#00F2FE" filter="url(#neonGlow)"/>
  </g>

  <!-- Animated Middle Counter-Ring (Counter-Clockwise) -->
  <g class="spin-ring-2">
    <circle cx="250" cy="120" r="48" fill="none" stroke="url(#ringGrad2)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="50 25 30 20" opacity="0.9"/>
    <!-- Small Orbiting Node -->
    <circle cx="202" cy="120" r="3" fill="#10B981" filter="url(#neonGlow)"/>
  </g>

  <!-- Center Financial AI Core -->
  <g class="core-pulse">
    <!-- Hexagonal Glow Badge -->
    <polygon points="250,92 274,106 274,134 250,148 226,134 226,106" fill="#0F172A" stroke="url(#coreGrad)" stroke-width="2" opacity="0.95"/>
    
    <!-- Mini Dynamic Financial Growth Bars Inside Core -->
    <rect class="bar-1" x="238" y="115" width="5" height="18" rx="2.5" fill="#38BDF8"/>
    <rect class="bar-2" x="247" y="106" width="5" height="27" rx="2.5" fill="#10B981"/>
    <rect class="bar-3" x="256" y="110" width="5" height="23" rx="2.5" fill="#34D399"/>
  </g>

  <!-- Branding & Status Typography -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title -->
    <text x="250" y="218" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="2.5">
      SME FINANCE COPILOT
    </text>

    <!-- Subtitle Badge -->
    <rect x="180" y="234" width="140" height="20" rx="10" fill="#1E293B" opacity="0.7"/>
    <text x="250" y="248" font-size="10.5" font-weight="600" fill="#38BDF8" letter-spacing="1.2">
      AI FINANCIAL ENGINE
    </text>

    <!-- Loading Subtext with Animated Pulse & Wave Dots -->
    <g class="text-pulse">
      <text x="238" y="280" font-size="12.5" font-weight="500" fill="#94A3B8" letter-spacing="0.8">
        Analyzing Ledger &amp; Cash Flow
      </text>
    </g>

    <!-- Animated Bouncing Dots -->
    <circle class="dot-1" cx="340" cy="276" r="2.5" fill="#34D399"/>
    <circle class="dot-2" cx="348" cy="276" r="2.5" fill="#38BDF8"/>
    <circle class="dot-3" cx="356" cy="276" r="2.5" fill="#818CF8"/>
  </g>
</svg>
