[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finova-finpilot"
version = "0.1.0"
description = "Finova Finpilot: Autonomous Financial Intelligence & Multilingual Operating System for SMEs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Finova Finpilot Team"}
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --tb=short"
